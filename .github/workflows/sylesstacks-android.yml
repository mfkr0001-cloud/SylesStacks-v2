
name: SylesStacks Mobile Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/sylesstacks-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Prepare APK ZIP
        run: |
          mkdir -p release
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          cp "$APK" release/SylesStacks-Mobile.apk
          cd release
          zip -j SylesStacks-Mobile-APK.zip SylesStacks-Mobile.apk

      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SylesStacks-Mobile-APK
          path: release/SylesStacks-Mobile-APK.zip
          if-no-files-found: error
