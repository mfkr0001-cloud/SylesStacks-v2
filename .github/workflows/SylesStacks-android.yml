
name: SylesStacks Mobile Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/sylesstacks-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Prepare APK ZIP
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found!"
            find android/app/build/outputs -type f
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/SylesStacks-Mobile.apk

          cd release
          zip -j SylesStacks-Mobile-APK.zip SylesStacks-Mobile.apk

          echo "ZIP CONTENTS:"
          unzip -l SylesStacks-Mobile-APK.zip

          unzip -t SylesStacks-Mobile-APK.zip
          
          if ! unzip -Z1 SylesStacks-Mobile-APK.zip | grep -qx "SylesStacks-Mobile.apk"; then
            echo "ERROR: APK missing from ZIP!"
            exit 1
          fi

      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SylesStacks-Mobile-APK
          path: release/SylesStacks-Mobile-APK.zip
          if-no-files-found: error
          compression-level: 0
